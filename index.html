<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expedição Inteligente</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{font:16px system-ui;background:#eef4f1;color:#16332b;margin:0}main{max-width:560px;margin:auto;padding:16px}section{background:white;padding:16px;border-radius:14px;margin:12px 0}button,input,select{box-sizing:border-box;width:100%;padding:12px;margin:5px 0;font:inherit;border:1px solid #aabbb3;border-radius:8px}button{background:#146b48;color:white;border:0}button:disabled{opacity:.5}#msg{overflow-wrap:anywhere}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px;border-bottom:1px solid #ddd}small{color:#52665c}</style><main><h1>Expedição Inteligente</h1><small>V3.3 • registros neste aparelho</small><section><input id="operador" placeholder="Nome do operador"><label>CNPJ em expedição<select id="active"><option value="">Selecione a empresa</option><option>THEBOXX</option><option>AUREONQUIM</option><option>MOTOBRANDS</option><option>PARCEIROS</option></select></label><p id="activeStatus" style="font-weight:bold;background:#e1f1e8;padding:12px;border-radius:8px">Nenhuma empresa selecionada</p><label>Tipo de envio<select id="shipping"><option value="">Selecione o tipo de envio</option><option>Flex</option><option>Entrega rápida</option><option>Envio normal</option></select></label><label>Canal do lote<select id="batch"><option value="">Selecione o canal</option><option>Mercado Livre</option><option>Shopee</option><option>TikTok Shop</option><option>Magalu</option><option>Site</option><option>Pedido DUDA</option><option>SMART AMARAL</option><option>Fornecedor Brasclean</option><option>MULTISHOP MARK</option><option>ETIQUETAS DN</option><option>ETIQUETAS CCM</option></select></label><button id="start">Abrir câmera</button><button id="stop">Fechar câmera</button><div id="reader"></div><input id="manual" placeholder="Código manual"><button id="read">Analisar código</button><p id="msg" role="status">Aguardando leitura</p><div id="confirm" hidden><label>Empresa da leitura<select id="empresa" disabled><option value="">Selecione</option><option>THEBOXX</option><option>AUREONQUIM</option><option>MOTOBRANDS</option><option>PARCEIROS</option></select></label><label>Canal<select id="canal"></select></label><label id="learnbox" hidden><input type="checkbox" id="learn" style="width:auto"> Associar este remetente Mercado Livre à empresa</label><button id="save">Confirmar pacote</button><button id="cancel">Cancelar leitura</button></div></section><section><h2>Relatório</h2><label>Período<select id="period"><option value="day">Hoje</option><option value="month">Este mês</option><option value="all">Todos</option></select></label><h2 id="total">0 pacotes</h2><table><thead><tr><th>Empresa / Canal</th><th>Pacotes</th></tr></thead><tbody id="rows"></tbody></table><button id="export">Exportar CSV</button><small>Dados locais: exporte regularmente. Não sincronizado com a planilha.</small></section><section><h2>Remetentes cadastrados</h2><div id="rules"></div></section></main><script>
'use strict';
const $=id=>document.getElementById(id), channels=["Mercado Livre","Shopee","TikTok Shop","Magalu","Site","Pedido DUDA","SMART AMARAL","Fornecedor Brasclean","MULTISHOP MARK","ETIQUETAS DN","ETIQUETAS CCM"], companies=['THEBOXX','AUREONQUIM','MOTOBRANDS','PARCEIROS'];
let records=JSON.parse(localStorage.getItem('exp_records_v2')||'[]'), rules=JSON.parse(localStorage.getItem('exp_rules_v2')||'{}'), pending=null, scanner=null, busy=false, last='', lastAt=0, audio;
records=records.map(r=>r.company==='MOTOBRAND'?{...r,company:'MOTOBRANDS'}:r);for(const id of Object.keys(rules))if(rules[id]==='MOTOBRAND')rules[id]='MOTOBRANDS';
function say(s){$('msg').textContent=s}
const tones={success:[[1100,.16]],pending:[[700,.14],[700,.14]],duplicate:[[480,.1],[480,.1],[480,.1]],error:[[220,.5]]};
function wav(pattern){const rate=22050, samples=[];for(const [hz,d] of pattern){for(let i=0;i<Math.floor(rate*d);i++){let env=Math.min(1,i/150,(rate*d-i)/250);samples.push(Math.round(22000*env*Math.sin(2*Math.PI*hz*i/rate)))}for(let i=0;i<rate*.075;i++)samples.push(0)}let b=new ArrayBuffer(44+samples.length*2),v=new DataView(b);const str=(p,t)=>{for(let i=0;i<t.length;i++)v.setUint8(p+i,t.charCodeAt(i))};str(0,'RIFF');v.setUint32(4,b.byteLength-8,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,samples.length*2,true);samples.forEach((n,i)=>v.setInt16(44+i*2,n,true));return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
const urls=Object.fromEntries(Object.entries(tones).map(([k,p])=>[k,wav(p)]));const player=new Audio();player.preload='auto';player.setAttribute('playsinline','');player.src=urls.success;
async function unlockAudio(){try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const resume=audio.resume();let b=audio.createBuffer(1,1,22050),n=audio.createBufferSource();n.buffer=b;n.connect(audio.destination);n.start();await resume}catch(e){}}
function mediaSound(type){try{player.pause();player.src=urls[type];player.currentTime=0;player.play().catch(()=>{})}catch(e){}}
function sound(type){try{if(!audio||audio.state!=='running'){mediaSound(type);return}let t=audio.currentTime+.015;for(const [hz,d] of tones[type]){let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=hz;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.55,t+.008);g.gain.setValueAtTime(.55,t+d-.02);g.gain.linearRampToValueAtTime(0,t+d);o.start(t);o.stop(t+d);t+=d+.075}}catch(e){mediaSound(type)}}
document.addEventListener('pointerdown',()=>{void unlockAudio()},{passive:true});
function fill(){let old=$('canal').value;$('canal').replaceChildren(new Option('Selecione',''));for(const c of channels)if(c!=='Site'||$('empresa').value==='AUREONQUIM')$('canal').add(new Option(c,c));if([...$('canal').options].some(o=>o.value===old))$('canal').value=old}
$('active').onchange=()=>{$('shipping').value='';$('batch').value='';pending=null;$('confirm').hidden=true;$('empresa').value=$('active').value;fill();$('activeStatus').textContent=$('active').value?'Bipando: '+$('active').value:'Nenhuma empresa selecionada';say('Empresa alterada. Confira a etiqueta antes de bipar.');};fill();
$('batch').onchange=()=>{pending=null;$('confirm').hidden=true;last='';say('Canal do lote: '+($('batch').value||'não selecionado'))};
function identify(raw){try{const j=JSON.parse(raw);if(j&&j.id!=null&&j.sender_id!=null&&Object.prototype.hasOwnProperty.call(j,'hash_code')&&/^\d+$/.test(String(j.id))&&/^\d+$/.test(String(j.sender_id)))return {key:'ML:'+j.id,channel:'Mercado Livre',sender:String(j.sender_id),company:rules[String(j.sender_id)]||(String(j.sender_id)==='1974608549'?'MOTOBRANDS':'')}}catch(e){}const normalized=raw.replace(/\s+/g,'').toUpperCase();const spx=normalized.match(/^(BR\d{12}[A-Z0-9])(?:SPXLM[A-Z0-9]+)?$/);if(spx)return {key:'RAW:'+spx[1],channel:'Shopee',company:'',aliases:[normalized]};if(/^999\d{12}$/.test(raw))return {key:'RAW:'+raw.trim(),channel:'TikTok Shop',company:''};return {key:'RAW:'+raw.trim(),channel:'',company:''}}
function scan(raw){if(!$('batch').value){say('Selecione o canal do lote antes de bipar');return}if(!$('shipping').value){say('Selecione o tipo de envio antes de bipar');sound('error');return}raw=String(raw).trim();if(!raw||pending||raw.length>2000)return;if(raw===last&&Date.now()-lastAt<2500)return;last=raw;lastAt=Date.now();if(/^\d{44}$/.test(raw.replace(/\s/g,''))){say('Nota fiscal ignorada. Bipe o QR Code de envio.');sound('error');return}let p=identify(raw);if(records.some(r=>r.key===p.key||(p.aliases||[]).some(a=>r.key==='RAW:'+a)||(p.channel==='Shopee'&&r.key.toUpperCase().startsWith(p.key.toUpperCase()+'SPXLM')))){say('Pacote já registrado');sound('duplicate');return}if(!$('operador').value.trim()){say('Informe o operador antes de bipar');sound('error');return}let active=$('active').value;if(!active){say('Selecione o CNPJ antes de bipar');sound('error');return}if(p.company&&p.company!==active){say('ATENÇÃO: etiqueta de '+p.company+' — CNPJ ativo: '+active+'. Pacote não registrado.');sound('error');return}let batch=$('batch').value;if(batch==='Site'&&active!=='AUREONQUIM'){say('Site disponível somente para AUREONQUIM');sound('error');return}if(batch&&p.channel&&batch!==p.channel){say('Canal da etiqueta diverge do lote. Confira antes de registrar.');sound('error');return}pending=p;if(channels.indexOf(batch)>=5&&!p.channel){register(active,batch,false);return}if(p.channel==='Shopee'||p.channel==='Mercado Livre'||(batch&&p.channel===batch)){register(active,p.channel,false);return}if(batch&&!p.channel&&/^\d{10}$/.test(raw)&&batch==='Mercado Livre'){pending.key='ML:'+raw;if(records.some(r=>r.key===pending.key||r.key==='RAW:'+raw)){pending=null;say('Pacote já registrado');sound('duplicate');return}register(active,batch,false);return}$('empresa').value=active;fill();$('canal').value=p.channel||batch||'';$('learnbox').hidden=!p.sender;$('learn').checked=false;$('confirm').hidden=false;say(p.channel?p.channel+' sugerido pelo padrão. Confirme o canal.':'Origem não reconhecida. Confirme o canal.');sound('pending')}
function register(company,channel,learn){if(!$('batch').value||channel!==$('batch').value){say('Confirme o canal do lote');sound('error');return}if(!$('shipping').value){say('Selecione o tipo de envio');sound('error');return}if(!pending||company!==$('active').value||(pending.company&&pending.company!==company)||!companies.includes(company)||!channels.includes(channel)||(channel==='Site'&&company!=='AUREONQUIM')){say('Selecione empresa e canal válidos');sound('error');return}if(! $('operador').value.trim()){say('Informe o operador');sound('error');return}let next=[...records,{key:pending.key,company,channel,shipping:$('shipping').value,operator:$('operador').value.trim(),date:new Date().toISOString()}];try{localStorage.setItem('exp_records_v2',JSON.stringify(next));records=next}catch(e){say('Não foi possível salvar neste aparelho');sound('error');return}if(learn&&pending.sender&&channel==='Mercado Livre'){rules[pending.sender]=company;try{localStorage.setItem('exp_rules_v2',JSON.stringify(rules))}catch(e){say('Pacote salvo, mas regra não persistida')}}pending=null;$('confirm').hidden=true;say('✓ Registrado: '+company+' • '+channel);sound('success');render()}
$('save').onclick=()=>register($('empresa').value,$('canal').value,$('learn').checked);$('cancel').onclick=()=>{pending=null;$('confirm').hidden=true;say('Leitura cancelada')};$('read').onclick=async()=>{await unlockAudio();if(!$('manual').value.trim()){say('Informe um código');sound('error');return}scan($('manual').value)};
$('start').onclick=async()=>{if(scanner||busy)return;void unlockAudio();if(!$('operador').value.trim()||!$('active').value||!$('shipping').value||!$('batch').value){say('Informe o operador, CNPJ, tipo de envio e canal do lote');sound('error');return}busy=true;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();await audio.resume()}catch(e){}try{scanner=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE,Html5QrcodeSupportedFormats.CODE_128]});await scanner.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.floor(Math.min(w*.9,320)),height:Math.floor(Math.min(h*.85,280))})},scan,()=>{});say('Câmera ativa');void unlockAudio()}catch(e){scanner=null;say('Erro de câmera: '+e);sound('error')}finally{busy=false}};
$('stop').onclick=async()=>{if(!scanner||busy)return;busy=true;try{await scanner.stop();scanner.clear();scanner=null;say('Câmera fechada')}catch(e){say(String(e))}finally{busy=false}};
const day=d=>new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(d));
function filtered(){let today=day(new Date()),p=$('period').value;return records.filter(r=>p==='all'||(p==='day'?day(r.date)===today:day(r.date).slice(0,7)===today.slice(0,7)))}
function render(){let data=filtered();$('total').textContent=data.length+' pacotes';$('rows').replaceChildren();for(let e of companies)for(let c of channels){if(c==='Site'&&e!=='AUREONQUIM')continue;for(const t of ['Flex','Entrega rápida','Envio normal','Não informado']){let count=data.filter(r=>r.company===e&&r.channel===c&&(r.shipping||'Não informado')===t).length;if(!count)continue;let tr=$('rows').insertRow();tr.insertCell().textContent=e+' / '+c+' / '+t;tr.insertCell().textContent=count}}if(!data.length){let tr=$('rows').insertRow();let td=tr.insertCell();td.colSpan=2;td.textContent='Nenhum pacote registrado neste período.'}$('rules').replaceChildren();for(let [id,e] of Object.entries(rules)){let b=document.createElement('button');b.textContent=id+' — '+e+' (remover)';b.onclick=()=>{if(confirm('Remover associação?')){delete rules[id];localStorage.setItem('exp_rules_v2',JSON.stringify(rules));render()}};$('rules').append(b)}}
$('period').onchange=render;$('export').onclick=()=>{const q=v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';let csv=['Data;Empresa;Canal;Operador;Código;Tipo de envio',...filtered().map(r=>[r.date,r.company,r.channel,r.operator,r.key,r.shipping||'Não informado'].map(q).join(';'))].join('\r\n');let url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='expedicao.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></html>
